# Conda environment for the analyses in this manuscript.
# R packages and the bioinformatics tools are listed with the versions actually used;
# see ENVIRONMENT.md for those verified on the analysis machine versus those recorded
# from Methods and tool outputs.
name: mycobacterium-fsm
channels: [conda-forge, bioconda, defaults]
dependencies:
  - python=3.13
  - pandas=2.2.3
  - numpy=2.4.3
  - scipy=1.16.2
  - statsmodels=0.14.6
  - openpyxl=3.1.5
  - biopython=1.83
  - r-base=4.5.2
  - r-ape=5.8.1
  - r-phytools=2.5.2
  - r-phylolm=2.6.5
  - r-nlme=3.1_169
  - r-geiger=2.0.11
  - r-castor=1.8.4
  - r-picante=1.8.2
  - hyphy=2.5.59
  - iqtree=2.0.7
  - mafft=7.526
  - blast=2.16.0
  - prodigal=2.6.3
  - bakta=1.11.4
  - gtdbtk=2.6.1
  - checkm2=0.1.3
  - gunc=1.0.1
  - orthofinder=2.5.5
  - gapseq=1.4.0
  - mmseqs2=18.8cc5c
  - eggnog-mapper=2.1.12
  - diamond=2.1.13
  - hmmer=3.4
  - fastani=1.34
  - singlem=0.21.3
